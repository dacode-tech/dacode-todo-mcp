[package]
name = "todo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "inspect/debug the store without an MCP client (D5)"

[dependencies]
todo-domain = { workspace = true }
todo-store = { workspace = true }
lexopt = { workspace = true }
# The dump document's serde derives, declared per-crate the way
# todo-store declares its own: the store's codec re-exports serialize it,
# and no engine dependency is added (U14).
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Temporary data roots for the end-to-end fixtures (U8-approved, the
# store's precedent): a test that builds a store never builds it at a
# fixed path or in the cwd.
tempfile = "3"

[lints]
workspace = true
